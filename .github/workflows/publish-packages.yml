name: Publish Mupt Packages

on:
  push:
    tags:
      - "v*-mupt.*"
  workflow_dispatch:
    inputs:
      version:
        description: Mupt package version, for example 0.84.4-mupt.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Mupt version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          case "$version" in
            *-mupt.*) ;;
            *) echo "Version must end in -mupt.<number>" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Ship the model catalog the upstream release was built and tested with,
      # not whatever the provider APIs list on publish day.
      - name: Hydrate model data from the upstream release
        env:
          MUPT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          upstream_version="${MUPT_VERSION%-mupt.*}"
          npm pack "@earendil-works/pi-ai@$upstream_version" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/earendil-works-pi-ai-$upstream_version.tgz" -C "$RUNNER_TEMP"
          rm -rf packages/ai/src/providers/data
          cp -r "$RUNNER_TEMP/package/dist/providers/data" packages/ai/src/providers/data

      - name: Build
        run: npm run build:offline

      - name: Validate
        run: npm run check

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Prepare Mupt package metadata
        env:
          MUPT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set --prefix packages/ai name=@mupt-ai/pi-ai version="$MUPT_VERSION"
          npm pkg set --prefix packages/ai repository.url=git+https://github.com/mupt-ai/pi.git

      # prepublishOnly would regenerate the model data from live provider APIs,
      # so publish the build that was validated above.
      - name: Publish
        run: npm publish --workspace packages/ai --tag latest --provenance --ignore-scripts
